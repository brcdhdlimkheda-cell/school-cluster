<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cluster Data Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <h2>Cluster પસંદ કરો:</h2>
  <select id="cluster">
    <option value="">-- ક્લસ્ટર પસંદ કરો --</option>
  </select>

  <h3>Details:</h3>
  <table border="1" id="details">
    <thead>
      <tr>
        <th>School</th>
        <th>Task Description-1</th>
        <th>Pen No.</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh45K32G2Zt8LCBcIBgxx64qZtNtCrwKltz80WDg9LFddf4VK4xTDMFf63VIqnkwy1UKlhy0HbJryY/pub?output=csv";

    let allData = [];

    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const parsed = Papa.parse(text, { header: true });
        allData = parsed.data;

        // Debug: print actual header keys
        console.log("Headers:", Object.keys(allData[0]));

        // Populate Cluster dropdown (unique values)
        const clusters = [...new Set(allData.map(r => (r.Cluster || "").trim()).filter(Boolean))];
        const select = document.getElementById("cluster");
        clusters.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      });

    // On cluster change → show details
    document.getElementById("cluster").addEventListener("change", e => {
      const cluster = e.target.value;
      const tbody = document.querySelector("#details tbody");
      tbody.innerHTML = "";

      allData.filter(r => (r.Cluster || "").trim() === cluster).forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.School || ""}</td>
          <td>${r["Task Description-1"] || ""}</td>
          <td>${r["Pen No."] || ""}</td>
          <td>${r.Status || ""}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  </script>
</body>
</html>
