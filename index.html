<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cluster & Task Data Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <h2>
    Select Cluster:
    <select id="cluster">
      <option value="">-- Select Cluster --</option>
    </select>
  </h2>

  <h3 id="taskTitle"></h3>

  <h3>Details:</h3>
  <table border="1" id="details">
    <thead>
      <tr>
        <th>School</th>
        <th>Task Description</th>
        <th>Pen No.</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const { jsPDF } = window.jspdf;
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh45K32G2Zt8LCBcIBgxx64qZtNtCrwKltz80WDg9LFddf4VK4xTDMFf63VIqnkwy1UKlhy0HbJryY/pub?output=csv";

    let allData = [];

    // Load CSV
    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const parsed = Papa.parse(text, { header: true });
        allData = parsed.data;

        // Populate Cluster dropdown
        const clusters = [...new Set(allData.map(r => (r["Cluster"] || "").trim()).filter(Boolean))];
        const select = document.getElementById("cluster");
        clusters.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      });

    // On cluster change → show task dropdown
    document.getElementById("cluster").addEventListener("change", e => {
      const cluster = e.target.value;
      const tbody = document.querySelector("#details tbody");
      tbody.innerHTML = "";

      // Clear old task + button
      const taskTitle = document.getElementById("taskTitle");
      taskTitle.innerHTML = "";
      const oldBtn = document.getElementById("download");
      if (oldBtn) oldBtn.remove();

      if(cluster){
        // Create Task dropdown
        taskTitle.innerHTML = "Select Task: ";
        const taskSelect = document.createElement("select");
        taskSelect.id = "task";
        taskTitle.appendChild(taskSelect);

        // Populate tasks from Task Description column
        const tasks = [];
        allData.filter(r => (r["Cluster"]||"").trim()===cluster).forEach(r=>{
          if(r["Task Description"]) tasks.push(r["Task Description"].trim());
        });
        [...new Set(tasks)].forEach(t=>{
          const opt=document.createElement("option");
          opt.value=t; opt.textContent=t;
          taskSelect.appendChild(opt);
        });

        // On task change → filter rows + show download button
        taskSelect.addEventListener("change", ev=>{
          const task=ev.target.value;
          tbody.innerHTML="";
          const rows=[];
          allData.filter(r=>
            (r["Cluster"]||"").trim()===cluster &&
            (r["Task Description"]||"").trim()===task
          ).forEach(r=>{
            const tr=document.createElement("tr");
            tr.innerHTML=`<td>${r["School"]||""}</td>
                          <td>${r["Task Description"]||""}</td>
                          <td>${r["Pen No."]||""}</td>
                          <td>${r["Status"]||""}</td>`;
            tbody.appendChild(tr);
            rows.push([r["School"]||"", r["Task Description"]||"", r["Pen No."]||"", r["Status"]||""]);
          });

          // Show Download button
          let oldBtn2=document.getElementById("download");
          if(oldBtn2) oldBtn2.remove();
          const btn=document.createElement("button");
          btn.id="download"; btn.textContent="Download PDF";
          taskTitle.appendChild(btn);

          btn.addEventListener("click", ()=>{
            const doc=new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
            doc.setFont("helvetica","bold"); doc.setFontSize(14);
            doc.text("Cluster: "+cluster+" | Task: "+task,14,20);
            doc.autoTable({
              startY:30,
              head:[["School","Task Description","Pen No.","Status"]],
              body:rows,
              styles:{font:"helvetica",fontSize:5},
              margin:{left:14,right:14}
            });
            doc.save(cluster+"-"+task+"-data.pdf");
          });
        });
      }
    });
  </script>
</body>
</html>
