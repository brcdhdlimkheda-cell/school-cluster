<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cluster Data Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h2>Cluster પસંદ કરો:</h2>
  <select id="cluster">
    <option value="">-- ક્લસ્ટર પસંદ કરો --</option>
  </select>

  <h3>Details:</h3>
  <table border="1" id="details">
    <thead>
      <tr>
        <th>School</th>
        <th>Task Description-1</th>
        <th>Pen No.</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <br>
  <button id="download">Download Gujarati PDF</button>

  <script>
    const { jsPDF } = window.jspdf;

    // Gujarati font Base64 string (Shruti.ttf)
    const gujaratiFontData = `AAEAAA...LONG_BASE64_STRING...==`;

    jsPDF.API.addFileToVFS("Shruti.ttf", gujaratiFontData);
    jsPDF.API.addFont("Shruti.ttf", "Shruti", "normal");

    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh45K32G2Zt8LCBcIBgxx64qZtNtCrwKltz80WDg9LFddf4VK4xTDMFf63VIqnkwy1UKlhy0HbJryY/pub?output=csv";

    let allData = [];

    // Load CSV
    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const rows = text.split("\n").map(r => r.split(","));
        allData = rows.slice(1); // skip header

        // Populate Cluster dropdown (unique values)
        const clusters = [...new Set(allData.map(r => r[0].trim()))];
        const select = document.getElementById("cluster");
        clusters.forEach(c => {
          if (c) {
            const opt = document.createElement("option");
            opt.value = c;
            opt.textContent = c;
            select.appendChild(opt);
          }
        });
      });

    // On cluster change → show details
    document.getElementById("cluster").addEventListener("change", e => {
      const cluster = e.target.value;
      const tbody = document.querySelector("#details tbody");
      tbody.innerHTML = "";

      allData.filter(r => r[0].trim() === cluster).forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r[1]}</td>
          <td>${r[2]}</td>
          <td>${r[3]}</td>
          <td>${r[4]}</td>
        `;
        tbody.appendChild(tr);
      });
    });

    // PDF export
    document.getElementById("download").addEventListener("click", () => {
      const cluster = document.getElementById("cluster").value;
      const doc = new jsPDF();
      doc.setFont("Shruti");
      doc.setFontSize(14);

      if (cluster) {
        doc.text("પસંદ કરેલ ક્લસ્ટર: " + cluster, 20, 20);

        let y = 40;
        allData.filter(r => r[0].trim() === cluster).forEach(r => {
          doc.text(`School: ${r[1]} | Task: ${r[2]} | Pen No: ${r[3]} | Status: ${r[4]}`, 20, y);
          y += 10;
        });
      } else {
        doc.text("કોઈ ક્લસ્ટર પસંદ કરેલ નથી.", 20, 20);
      }

      doc.save("cluster-data.pdf");
    });
  </script>
</body>
</html>
