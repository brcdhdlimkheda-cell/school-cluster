<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gujarati PDF Export with Google Sheet Dropdown</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h2>Cluster પસંદ કરો:</h2>
  <select id="cluster">
    <option value="">-- ક્લસ્ટર પસંદ કરો --</option>
  </select>

  <br><br>
  <button id="download">Download Gujarati PDF</button>

  <script>
    const { jsPDF } = window.jspdf;

    // Paste your Base64 string here
    const gujaratiFontData = `AAEAAA...LONG_BASE64_STRING...==`;

    // Register font with jsPDF
    jsPDF.API.addFileToVFS("Shruti.ttf", gujaratiFontData);
    jsPDF.API.addFont("Shruti.ttf", "Shruti", "normal");

    // Fetch cluster list from Google Apps Script WebApp
    // Replace with your deployed WebApp URL
    const sheetUrl = "YOUR_GOOGLE_APPS_SCRIPT_WEBAPP_URL";

    fetch(sheetUrl)
      .then(res => res.json())
      .then(data => {
        const select = document.getElementById("cluster");
        data.forEach(row => {
          if (row[0]) {
            const opt = document.createElement("option");
            opt.value = row[0];
            opt.textContent = row[0];
            select.appendChild(opt);
          }
        });
      });

    document.getElementById("download").addEventListener("click", () => {
      const clusterValue = document.getElementById("cluster").value;
      const doc = new jsPDF();
      doc.setFont("Shruti");
      doc.setFontSize(16);

      if (clusterValue) {
        doc.text("પસંદ કરેલ ક્લસ્ટર: " + clusterValue, 20, 30);
      } else {
        doc.text("કોઈ ક્લસ્ટર પસંદ કરેલ નથી.", 20, 30);
      }

      doc.text("ગુજરાતી લખાણ symbols નહીં, સાચા અક્ષરોમાં દેખાશે!", 20, 50);

      doc.save("cluster-demo.pdf");
    });
  </script>
</body>
</html>
