<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gujarati PDF Export</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <button id="download">Download Gujarati PDF</button>

  <script>
    const { jsPDF } = window.jspdf;

    // Paste your Base64 string here
    const gujaratiFontData = `AAEAAA...LONG_BASE64_STRING...==`;

    // Register font with jsPDF
    jsPDF.API.addFileToVFS("Shruti.ttf", gujaratiFontData);
    jsPDF.API.addFont("Shruti.ttf", "Shruti", "normal");

    document.getElementById("download").addEventListener("click", () => {
      const doc = new jsPDF();
      doc.setFont("Shruti");
      doc.setFontSize(16);

      // Gujarati text example
      doc.text("ગુજરાતી લખાણ હવે symbols નહીં, સાચા અક્ષરોમાં દેખાશે!", 20, 30);

      doc.save("gujarati-demo.pdf");
    });
  </script>
</body>
</html>
