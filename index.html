<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <title>Cluster School Tasks</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    .pending { color: red; font-weight: bold; }
    .completed { color: green; font-weight: bold; }
    button { margin-top: 15px; padding: 8px 12px; }
  </style>
</head>
<body>
  <h2>ક્લસ્ટર મુજબ શાળાની બાકી કામગીરી</h2>

  <label for="clusterFilter">Cluster પસંદ કરો:</label>
  <select id="clusterFilter" onchange="filterCluster()">
    <option value="">-- પસંદ કરો --</option>
  </select>

  <button onclick="exportFilteredPDF()">Export Filtered PDF</button>

  <table id="taskTable">
    <thead>
      <tr>
        <th>Cluster</th>
        <th>School</th>
        <th>Task Description</th>
        <th>Due Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- ✅ jsPDF + autoTable libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

  <script>
    // ✅ Publish થયેલી JSON link મૂકો (tab name સાચું હોવું જોઈએ)
    const sheetUrl = "https://docs.google.com/spreadsheets/d/1topaEo86sHDVPVXeLwkX7t3MOVscreNM8osUcyy8a1U/gviz/tq?tqx=out:json&sheet=Sheet1";

    async function loadData() {
      try {
        const response = await fetch(sheetUrl);
        const text = await response.text();
        const json = JSON.parse(text.substr(47).slice(0, -2));

        const clusterSet = new Set();
        const allRows = [];

        json.table.rows.forEach(row => {
          const cluster = row.c[0]?.v ? row.c[0].v.trim().toUpperCase() : "";
          const school = row.c[1]?.v || "";
          const task = row.c[2]?.v || "";
          const due = row.c[3]?.v || "";
          const status = row.c[4]?.v || "";

          if (!cluster) return;

          const tr = document.createElement("tr");
          const statusClass = status.toLowerCase() === "pending" ? "pending" : "completed";
          tr.innerHTML = `
            <td>${cluster}</td>
            <td>${school}</td>
            <td>${task}</td>
            <td>${due}</td>
            <td class="${statusClass}">${status}</td>
          `;
          allRows.push(tr);
          clusterSet.add(cluster);
        });

        // ✅ Dropdown reset + populate
        const clusterFilter = document.getElementById("clusterFilter");
        clusterFilter.innerHTML = '<option value="">-- પસંદ કરો --</option>';
        Array.from(clusterSet).sort().forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          clusterFilter.appendChild(opt);
        });

        document.querySelector("#taskTable tbody").innerHTML = "";
        window.allRows = allRows;
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    function filterCluster() {
      const filter = document.getElementById("clusterFilter").value;
      const tbody = document.querySelector("#taskTable tbody");
      tbody.innerHTML = "";

      if (!filter) return;

      window.allRows.forEach(row => {
        const cluster = row.cells[0].textContent.trim().toUpperCase();
        if (cluster === filter) {
          tbody.appendChild(row.cloneNode(true));
        }
      });
    }

    function exportFilteredPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.text("Cluster School Tasks", 14, 16);

      // ✅ Export only filtered rows
      const rows = Array.from(document.querySelectorAll("#taskTable tbody tr")).map(tr =>
        Array.from(tr.cells).map(td => td.textContent)
      );

      if (rows.length === 0) {
        alert("કોઈ cluster select નથી કર્યું અથવા rows નથી.");
        return;
      }

      doc.autoTable({
        head: [['Cluster', 'School', 'Task Description', 'Due Date', 'Status']],
        body: rows,
        startY: 25
      });

      doc.save("Filtered_Cluster_Tasks.pdf");
    }

    // ✅ First load
    loadData();
  </script>
</body>
</html>
