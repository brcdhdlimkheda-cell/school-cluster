<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cluster Data Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <h2 id="clusterTitle">
    Select Cluster:
    <select id="cluster">
      <option value="">-- Select Cluster --</option>
    </select>
  </h2>

  <h3>Details:</h3>
  <table border="1" id="details">
    <thead>
      <tr>
        <th>School</th>
        <th>Task Description-1</th>
        <th>Pen No.</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const { jsPDF } = window.jspdf;
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh45K32G2Zt8LCBcIBgxx64qZtNtCrwKltz80WDg9LFddf4VK4xTDMFf63VIqnkwy1UKlhy0HbJryY/pub?output=csv";

    let allData = [];

    // Load CSV
    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const parsed = Papa.parse(text, { header: true });
        allData = parsed.data;

        // Populate Cluster dropdown
        const clusters = [...new Set(allData.map(r => (r["Cluster"] || "").trim()).filter(Boolean))];
        const select = document.getElementById("cluster");
        clusters.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      });

    // On cluster change → show details + button
    document.getElementById("cluster").addEventListener("change", e => {
      const cluster = e.target.value;
      const tbody = document.querySelector("#details tbody");
      tbody.innerHTML = "";

      // Remove old button if exists
      const oldBtn = document.getElementById("download");
      if (oldBtn) oldBtn.remove();

      if (cluster) {
        // Show cluster name + button
        const title = document.getElementById("clusterTitle");
        const btn = document.createElement("button");
        btn.id = "download";
        btn.textContent = "Download PDF";
        title.appendChild(btn);

        // Fill table
        const rows = [];
        allData.filter(r => (r["Cluster"] || "").trim() === cluster).forEach(r => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${r["School"] || ""}</td>
            <td>${r["Task Description-1"] || ""}</td>
            <td>${r["Pen No."] || ""}</td>
            <td>${r["Status"] || ""}</td>
          `;
          tbody.appendChild(tr);

          rows.push([r["School"] || "", r["Task Description-1"] || "", r["Pen No."] || "", r["Status"] || ""]);
        });

        // Button action → PDF export
        btn.addEventListener("click", () => {
          const doc = new jsPDF({
            orientation: "portrait",
            unit: "mm",
            format: "a4"
          });

          // Heading
          doc.setFont("helvetica", "bold");
          doc.setFontSize(14);
          doc.text("Cluster: " + cluster, 14, 20);

          // Table
          doc.setFont("helvetica", "normal");
          doc.autoTable({
            startY: 30,
            head: [["School", "Task Description-1", "Pen No.", "Status"]],
            body: rows,
            styles: { font: "helvetica", fontSize: 8 },
            margin: { left: 14, right: 14 }
          });

          doc.save(cluster + "-data.pdf");
        });
      }
    });
  </script>
</body>
</html>
