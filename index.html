<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gujarati PDF Export with Google Sheet Dropdown</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h2>Cluster પસંદ કરો:</h2>
  <select id="cluster">
    <option value="">-- ક્લસ્ટર પસંદ કરો --</option>
  </select>

  <br><br>
  <button id="download">Download Gujarati PDF</button>

  <script>
    const { jsPDF } = window.jspdf;

    // Gujarati font Base64 string (Shruti.ttf)
    const gujaratiFontData = `AAEAAA...LONG_BASE64_STRING...==`;

    // Register font with jsPDF
    jsPDF.API.addFileToVFS("Shruti.ttf", gujaratiFontData);
    jsPDF.API.addFont("Shruti.ttf", "Shruti", "normal");

    // Google Sheet CSV link (your published link)
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh45K32G2Zt8LCBcIBgxx64qZtNtCrwKltz80WDg9LFddf4VK4xTDMFf63VIqnkwy1UKlhy0HbJryY/pub?output=csv";

    // Populate dropdown from CSV
    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const rows = text.split("\n");
        const select = document.getElementById("cluster");
        rows.forEach(row => {
          if (row.trim()) {
            const opt = document.createElement("option");
            opt.value = row.trim();
            opt.textContent = row.trim();
            select.appendChild(opt);
          }
        });
      });

    // Generate PDF with Gujarati font + selected cluster
    document.getElementById("download").addEventListener("click", () => {
      const clusterValue = document.getElementById("cluster").value;
      const doc = new jsPDF();
      doc.setFont("Shruti");
      doc.setFontSize(16);

      if (clusterValue) {
        doc.text("પસંદ કરેલ ક્લસ્ટર: " + clusterValue, 20, 30);
      } else {
        doc.text("કોઈ ક્લસ્ટર પસંદ કરેલ નથી.", 20, 30);
      }

      doc.text("ગુજરાતી લખાણ symbols નહીં, સાચા અક્ષરોમાં દેખાશે!", 20, 50);

      doc.save("cluster-demo.pdf");
    });
  </script>
</body>
</html>
