<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cluster Dropdown Test</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <h2>Cluster પસંદ કરો:</h2>
  <select id="cluster">
    <option value="">-- ક્લસ્ટર પસંદ કરો --</option>
  </select>

  <script>
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSh45K32G2Zt8LCBcIBgxx64qZtNtCrwKltz80WDg9LFddf4VK4xTDMFf63VIqnkwy1UKlhy0HbJryY/pub?output=csv";

    fetch(sheetUrl)
      .then(res => res.text())
      .then(text => {
        const parsed = Papa.parse(text, { header: true });
        const allData = parsed.data;

        // Debug: print headers
        console.log("Headers:", Object.keys(allData[0]));

        // Populate Cluster dropdown
        const clusters = [...new Set(allData.map(r => r.Cluster?.trim()).filter(Boolean))];
        const select = document.getElementById("cluster");
        clusters.forEach(c => {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = c;
          select.appendChild(opt);
        });
      });
  </script>
</body>
</html>
